name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 确保这里的分支名和你的主分支名一致，通常是 main 或 master

# 添加权限设置
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 你的 dev.md 推荐的是 v16 以上，这里用 v18 比较稳定
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # 根据你的 package.json，这个命令会运行 webpack --mode production

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 这个目录就是你项目里 Webpack 打包后输出的目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4